services:
  notifier:
    build:
      context: .
      dockerfile: docker/notifier/Dockerfile
    networks:
      - kafka-net
    volumes:
      - dedup-data:/app/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-volatility}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-volatility.dlq}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-notifier}
      TELEGRAM_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_MAX_RETRIES: ${TELEGRAM_MAX_RETRIES:-3}
      TELEGRAM_BASE_DELAY: ${TELEGRAM_BASE_DELAY:-2}
      DEDUP_DB_PATH: ${DEDUP_DB_PATH:-/app/data/dedup.db}

networks:
  kafka-net:
    external: true

volumes:
  dedup-data:
