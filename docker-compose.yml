services:
  notifier:
    build:
      context: .
      dockerfile: docker/notifier/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-host.docker.internal:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-volatility.alerts}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-notifier}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
